services:
  app:
    build:
      context: .
      dockerfile: docker/php-fpm/Dockerfile
    container_name: cake_app_php
    env_file:
      - config/.env
    volumes:
      - ./:/var/www/html
    networks:
      - appnet
    depends_on:
      - db
    restart: unless-stopped

  web:
    image: nginx:1.25-alpine
    container_name: cake_app_nginx
    depends_on:
      - app
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - appnet
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: cake_app_mysql
    command: ["--default-authentication-plugin=mysql_native_password"]
    ports:
      - "33070:3306"
    environment:
      - MYSQL_DATABASE=${DB_DATABASE:-my_app}
      - MYSQL_USER=${DB_USERNAME:-app}
      - MYSQL_PASSWORD=${DB_PASSWORD:-app}
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-root}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - appnet
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: cake_app_mailhog
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - appnet
    restart: unless-stopped

volumes:
  db_data:

networks:
  appnet:
    driver: bridge
